name: yala-flood-data-pipeline

on:
  schedule:
    - cron: "*/15 * * * *"   # ทุก 15 นาที
  workflow_dispatch:

concurrency:
  group: yala-flood-data-pipeline
  cancel-in-progress: false

jobs:
  fetch-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: pip install -r backend/requirements.txt
      - name: Hermetic Unit & Formula v2 Tests
        run: pytest -q backend/tests
      - name: Run Multi-Source Pipeline (fail-closed)
        run: python backend/pipeline.py --sync-mobile-asset
      - name: Verify Snapshot Bundle (Dry-Run)
        run: python backend/publish_supabase.py --snapshot-dir backend/output --dry-run
      - name: Publish Snapshot to Supabase CDN (when secrets configured)
        if: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python backend/publish_supabase.py --snapshot-dir backend/output
      - name: Upload snapshot artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yala-flood-snapshot-${{ github.run_id }}
          path: |
            backend/output/latest.json
            backend/output/manifest.json
          retention-days: 7
