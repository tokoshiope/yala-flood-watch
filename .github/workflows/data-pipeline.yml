name: yala-flood-data-pipeline

on:
  schedule:
    - cron: "*/10 * * * *"   # ทุก 10 นาที (ตรงรอบ สสน./พพภ.)
  workflow_dispatch:

concurrency:
  group: yala-flood-data-pipeline
  cancel-in-progress: false

jobs:
  fetch-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: pip install -r backend/requirements.txt
      - name: Hermetic Unit, Formula v5 & GeoJSON Topology Tests
        run: pytest -q backend/tests
      - name: Run Multi-Source Pipeline (fail-closed)
        run: python backend/pipeline.py --sync-mobile-asset
      - name: Verify Snapshot Bundle (Dry-Run)
        run: python backend/publish_supabase.py --snapshot-dir backend/output --dry-run
      - name: Verify FCM Push Payload (Dry-Run)
        run: python backend/notify_fcm.py --snapshot-dir backend/output --dry-run
      - name: Detect optional publish/push secrets
        id: config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "has_supabase=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_supabase=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "has_firebase=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_firebase=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish Snapshot to Supabase CDN (when secrets configured)
        if: steps.config.outputs.has_supabase == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python backend/publish_supabase.py --snapshot-dir backend/output
      - name: Restore FCM Cooldown State Cache
        if: steps.config.outputs.has_firebase == 'true'
        uses: actions/cache@v4
        with:
          path: backend/output/fcm_state.json
          key: fcm-state-${{ github.run_id }}
          restore-keys: |
            fcm-state-
      - name: Dispatch FCM Topic Push Alerts (when Firebase secret configured)
        if: steps.config.outputs.has_firebase == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python backend/notify_fcm.py --snapshot-dir backend/output --state-file backend/output/fcm_state.json
      - name: Upload snapshot artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yala-flood-snapshot-${{ github.run_id }}
          path: |
            backend/output/latest.json
            backend/output/manifest.json
          retention-days: 7
