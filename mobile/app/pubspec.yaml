name: yala_flood_app
description: >-
  แอพ "น้ำท่วมยะลา" (Yala Flood Watch) — iOS-First แอพฟรีเพื่อประชาชน
  แจ้งเตือนภัยน้ำท่วมล่วงหน้าเฉพาะจังหวัดยะลา (รหัส 95) เชื่อมต่อ 5 ฐานข้อมูลจริง
publish_to: 'none'

version: 0.3.0+3

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  material_ui: ^1.11.1
  http: ^1.6.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  provider: ^6.1.5
  shared_preferences: ^2.5.6
  geolocator: ^14.1.2
  url_launcher: ^6.3.3
  flutter_local_notifications: ^23.0.4
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  app_links: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/snapshots/
    - assets/geo/
